<div class="col-md-6 col-lg-4"><article class="course-card">
  <a href="{% url 'website:blog_detail' post.slug %}" tabindex="-1" aria-hidden="true"><img src="{{ post.image }}" alt="" loading="lazy"></a>
  <div class="body"><span class="chip mb-2 align-self-start">{{ post.category_label }}</span>
    <h5 class="mb-3"><a href="{% url 'website:blog_detail' post.slug %}" class="text-reset">{{ post.title }}</a></h5>
    <small class="text-secondary mt-auto">{{ post.author_name|default:site.site_name }} · {{ post.read_time }} min read</small></div>
</article></div>
